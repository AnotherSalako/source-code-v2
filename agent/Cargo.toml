[package]
name = "jupiter-agent"
version = "0.1.0"
edition = "2021"
description = "Jupiter endpoint agent — v1: enrollment + read-only inventory check-in. No remote command execution, no auto-update. See README.md."

[[bin]]
name = "jupiter-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
anyhow = "1"
dirs = "6"
hostname = "0.4"
# OS/process/network info — cross-platform, pure Rust, no C toolchain
# needed (unlike reqwest's rustls-tls chain, which does — see README
# "Building"). Doesn't cover installed-software enumeration (no unified
# cross-platform API exists for that); see inventory/software.rs for the
# per-platform approach there instead.
sysinfo = "0.32"

# Windows/macOS: the real OS credential store (Credential Manager / Keychain)
# via the `keyring` crate. Linux deliberately excluded — see storage.rs for
# why a 0600 file is the honest v1 answer there instead of pretending
# `keyring`'s Secret Service backend (which assumes a desktop session with
# gnome-keyring/kwallet running) covers headless servers, which it doesn't.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# features are NOT optional here: keyring 3.x defaults to an in-memory mock
# backend on every platform unless a real one is explicitly enabled. The
# mock accepts set_secret() and get_secret() calls without error, so a build
# without these features looks correct in a single process (enroll, which
# reads the key straight back from memory) and only fails the moment a
# *second* process asks for the key — exactly the enroll-then-whoami gap a
# real device restart would hit. Caught by actually running the compiled
# binary as two separate processes, not by reasoning about the crate.
keyring = { version = "3", features = ["windows-native", "apple-native"] }

# Windows registry access for installed-software enumeration
# (HKLM\...\Uninstall) — pure Rust, no C toolchain needed.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
