[package]
name = "jupiter-agent"
version = "0.1.0"
edition = "2021"
description = "Jupiter endpoint agent — v1: enrollment only. No inventory collection, no remote command execution, no auto-update. See README.md."

[[bin]]
name = "jupiter-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
anyhow = "1"
dirs = "6"
hostname = "0.4"

# Windows/macOS: the real OS credential store (Credential Manager / Keychain)
# via the `keyring` crate. Linux deliberately excluded — see storage.rs for
# why a 0600 file is the honest v1 answer there instead of pretending
# `keyring`'s Secret Service backend (which assumes a desktop session with
# gnome-keyring/kwallet running) covers headless servers, which it doesn't.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = "3"
